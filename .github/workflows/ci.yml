name: ci

on:
  push:
    paths-ignore:
      - '**/README.md'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**/README.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onpush_job:
    runs-on: ubuntu-latest
    name: Scan and check
    steps:
      # run git checkout
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # setup go
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.25'
          check-latest: true

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.26
          go-package: ./...

      - name: Grype
        uses: anchore/scan-action@v7
        with:
          path: "."
          fail-build: true
          severity-cutoff: negligible

